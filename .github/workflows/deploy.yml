name: Deploy to Cloudflare Pages

# Auto-deploy the allowlisted static build on every push to main.
# Reuses deploy.js (the same allowlist + forbidden-path safety net used locally),
# so CI can never publish memory/, configs, or secrets even if PUBLISH is edited.

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Cancel an in-flight deploy if a newer commit lands, so live always reflects
# the latest push rather than whichever job happens to finish last.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

# Least privilege: the deploy authenticates to Cloudflare with CLOUDFLARE_API_TOKEN,
# not the GitHub token, so this job needs no write scope on the repo.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy from main. workflow_dispatch lets you pick any ref in the Actions
    # tab; without this guard a manual run could ship a non-main branch's code with
    # the Cloudflare secrets. Push triggers are already main-only (see `on:` above).
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        # Pinned to a full commit SHA (supply-chain hardening); comment tracks the tag.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install Wrangler
        run: npm install --no-save wrangler@4.97.0

      - name: Build and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pages project name. Set the CLOUDFLARE_PROJECT repository *variable*
          # (it is non-sensitive) to deploy to your own project; falls back to
          # "wwyw2" if unset. See README → Deploying.
          CLOUDFLARE_PROJECT: ${{ vars.CLOUDFLARE_PROJECT }}
