<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Terms of Service — WeWatchYourWebsite</title>
  <meta name="description" content="Terms of Service for WeWatchYourWebsite." />
  <meta name="theme-color" content="#05060a" />
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://wewatchyourwebsite.com/terms-of-service/" />
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
  <style>
    :root{ --bg:#04050a; --bg2:#070910; --text:#e8ecf2; --muted:#9aa3b2; --accent:#69ff12; }
    *{ box-sizing:border-box; }
    body{
      margin:0; min-height:100vh; background:var(--bg); color:var(--text);
      font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif; line-height:1.6;
      display:flex; align-items:center; justify-content:center; padding:2rem;
    }
    main{ max-width:42rem; width:100%; }
    .eyebrow{
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--accent);
      letter-spacing:.22em; text-transform:uppercase; font-size:.72rem; margin:0 0 1rem;
    }
    h1{ font-size:clamp(1.8rem,5vw,2.6rem); margin:0 0 1rem; letter-spacing:-0.01em; }
    p{ color:var(--muted); margin:0 0 1rem; }
    a{ color:var(--accent); }
    .card{ background:var(--bg2); border:1px solid rgba(255,255,255,0.07); border-radius:14px; padding:clamp(1.5rem,4vw,2.5rem); }
    .back{ display:inline-block; margin-top:1.5rem; font-size:.9rem; }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">WeWatchYourWebsite</p>
    <h1>Terms of Service</h1>
    <p>Our full Terms of Service are being finalized and will be published here shortly.</p>
    <p>
      In the meantime, if you have questions about using our services, please
      <a href="/#final-cta">get in touch with our team</a> — a real person will respond.
    </p>
    <a class="back" href="/">&larr; Back to home</a>
  </main>
</body>
</html>
